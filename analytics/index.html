<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات – MDWN Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="../Circle Logo.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --black:   #0e0e10;
            --raisin:  #1a1a1f;
            --surface: #242429;
            --surface2:#2c2c33;
            --border:  rgba(255,255,255,0.07);
            --snow:    #f5f4f2;
            --muted:   rgba(245,244,242,0.42);
            --blue:    #3b82f6;
            --teal:    #2dd4bf;
            --yellow:  #fbbf24;
            --red:     #f87171;
            --purple:  #a78bfa;
            --orange:  #fb923c;
            --font:    'Rubik', sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;}
        body{background:var(--black);color:var(--snow);font-family:var(--font);min-height:100vh;direction:rtl;line-height:1.6;overflow-x:hidden;}

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar{width:5px;}
        ::-webkit-scrollbar-track{background:var(--black);}
        ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px;}

        /* ─── LOGIN ─── */
        #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 0%,rgba(59,130,246,0.12) 0%,transparent 60%),var(--black);}
        .login-card{background:var(--raisin);border:1px solid var(--border);border-radius:28px;padding:3rem 2.5rem;width:100%;max-width:400px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,0.7);}
        .login-dots{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem;}
        .login-dot{width:12px;height:12px;border-radius:50%;}
        .login-card h1{font-size:1.4rem;font-weight:700;margin-bottom:.3rem;}
        .login-card p{color:var(--muted);font-size:.88rem;margin-bottom:2rem;}
        .pin-input{display:flex;gap:.75rem;justify-content:center;margin-bottom:1.5rem;direction:ltr;}
        .pin-digit{width:58px;height:66px;border:2px solid var(--border);border-radius:16px;background:var(--surface);color:var(--snow);font-size:2rem;font-weight:700;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s;font-family:var(--font);-webkit-text-security:disc;}
        .pin-digit:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.2);}
        .btn-login{width:100%;padding:.9rem;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:600;font-family:var(--font);cursor:pointer;transition:opacity .2s,transform .2s;}
        .btn-login:hover{opacity:.88;transform:translateY(-1px);}
        .login-error{color:var(--red);font-size:.85rem;margin-top:.75rem;min-height:1.2em;}

        /* ─── DASHBOARD ─── */
        #dashboard{display:none;min-height:100vh;}

        /* ─── HEADER ─── */
        .dash-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(26,26,31,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
        .dash-brand{display:flex;align-items:center;gap:.8rem;}
        .brand-dots{display:flex;gap:4px;}
        .brand-dot{width:9px;height:9px;border-radius:50%;}
        .brand-name{font-weight:700;font-size:1.05rem;}
        .brand-sub{font-size:.72rem;color:var(--muted);margin-top:1px;}
        .live-badge{display:flex;align-items:center;gap:6px;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25);border-radius:99px;padding:.22rem .7rem;font-size:.72rem;color:var(--teal);font-weight:500;}
        .live-dot{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:pulse 1.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
        .btn-logout{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:.35rem .9rem;font-size:.82rem;font-family:var(--font);cursor:pointer;transition:border-color .2s,color .2s;}
        .btn-logout:hover{border-color:var(--red);color:var(--red);}

        /* ─── PILL NAV BAR ─── */
        .nav-bar-wrap{position:sticky;top:57px;z-index:150;background:rgba(14,14,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.75rem 2rem;}
        .nav-bar{display:flex;align-items:center;gap:.25rem;overflow-x:auto;position:relative;-ms-overflow-style:none;scrollbar-width:none;}
        .nav-bar::-webkit-scrollbar{display:none;}
        .nav-pill{position:relative;z-index:2;border:none;background:none;color:var(--muted);font-family:var(--font);font-size:.85rem;font-weight:500;padding:.5rem 1.1rem;border-radius:99px;cursor:pointer;transition:color .25s;white-space:nowrap;display:flex;align-items:center;gap:.4rem;}
        .nav-pill:hover{color:var(--snow);}
        .nav-pill.active{color:var(--snow);font-weight:600;}
        .nav-pill-indicator{position:absolute;top:0;height:100%;border-radius:99px;background:var(--surface2);border:1px solid var(--border);transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);z-index:1;pointer-events:none;}
        .nav-separator{width:1px;height:22px;background:var(--border);margin:0 .35rem;flex-shrink:0;}

        /* ─── DASH BODY ─── */
        .dash-body{padding:2rem;max-width:1200px;margin:0 auto;}

        /* ─── SECTION PANEL ─── */
        .section-panel{display:none;}
        .section-panel.active{display:block;animation:fadeIn .3s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

        /* ─── KPI ROW ─── */
        .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.75rem;}
        .kpi-card{background:var(--raisin);border:1px solid var(--border);border-radius:18px;padding:1.25rem 1.4rem;transition:border-color .25s,transform .25s;}
        .kpi-card:hover{border-color:rgba(255,255,255,.14);transform:translateY(-2px);}
        .kpi-label{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem;}
        .kpi-val{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-1px;}
        .kpi-sub{font-size:.72rem;color:var(--muted);margin-top:.35rem;}

        /* ─── CHARTS GRID ─── */
        .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;}
        .charts-grid.triple{grid-template-columns:repeat(3,1fr);}
        .chart-card{background:var(--raisin);border:1px solid var(--border);border-radius:18px;padding:1.4rem;overflow:hidden;}
        .chart-card.full{grid-column:1/-1;}
        .chart-title{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}
        .chart-title-icon{font-size:1rem;}
        .chart-wrap{position:relative;height:200px;}
        .chart-wrap.tall{height:240px;}
        .chart-wrap.short{height:160px;}

        /* ─── BAR LIST (horizontal ranked list) ─── */
        .bar-list{display:flex;flex-direction:column;gap:.6rem;margin-top:.25rem;}
        .bar-item{display:flex;flex-direction:column;gap:.25rem;}
        .bar-item-row{display:flex;align-items:center;justify-content:space-between;}
        .bar-item-label{font-size:.8rem;color:var(--snow);font-weight:500;display:flex;align-items:center;gap:.4rem;}
        .bar-item-val{font-size:.8rem;font-weight:700;color:var(--muted);}
        .bar-track{height:5px;background:var(--surface);border-radius:99px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1);}

        /* ─── SECTION HEADER ─── */
        .section-hero{display:flex;align-items:center;gap:1rem;margin-bottom:1.75rem;padding:1.5rem;background:var(--raisin);border:1px solid var(--border);border-radius:20px;}
        .section-hero-icon{font-size:2.5rem;flex-shrink:0;}
        .section-hero-name{font-size:1.4rem;font-weight:800;line-height:1.2;}
        .section-hero-id{font-size:.75rem;color:var(--muted);margin-top:.2rem;direction:ltr;}
        .section-hero-bar{width:5px;border-radius:99px;align-self:stretch;flex-shrink:0;}

        /* ─── CONVERSION BADGE ─── */
        .conv-row{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--surface);border-radius:12px;margin-top:.75rem;}
        .conv-label{font-size:.78rem;color:var(--muted);}
        .conv-val{font-size:.95rem;font-weight:700;color:var(--yellow);}

        /* ─── SKELETON ─── */
        .skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;display:inline-block;}
        @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

        /* ─── FOOTER ─── */
        .dash-footer{text-align:center;color:var(--muted);font-size:.74rem;padding:2rem;border-top:1px solid var(--border);margin-top:1.5rem;}

        /* ─── RESPONSIVE ─── */
        @media(max-width:900px){
            .charts-grid{grid-template-columns:1fr;}
            .charts-grid.triple{grid-template-columns:1fr;}
            .dash-body{padding:1rem;}
            .nav-bar-wrap{padding:.6rem 1rem;}
            .kpi-row{grid-template-columns:1fr 1fr;}
            .live-badge{display:none;}
        }
        @media(max-width:480px){
            .kpi-row{grid-template-columns:1fr;}
            .dash-header{padding:.8rem 1rem;}
        }
    </style>
</head>
<body>

<!-- ── LOGIN ───────────────────────────────────────── -->
<div id="login-screen">
    <div class="login-card">
        <div class="login-dots">
            <div class="login-dot" style="background:var(--blue)"></div>
            <div class="login-dot" style="background:var(--teal)"></div>
            <div class="login-dot" style="background:var(--yellow)"></div>
            <div class="login-dot" style="background:var(--red)"></div>
        </div>
        <h1>إحصائيات MDWN</h1>
        <p>أدخل رمز الوصول للمتابعة</p>
        <div class="pin-input">
            <input class="pin-digit" id="d1" maxlength="1" type="password" inputmode="numeric" pattern="[0-9]">
            <input class="pin-digit" id="d2" maxlength="1" type="password" inputmode="numeric" pattern="[0-9]">
            <input class="pin-digit" id="d3" maxlength="1" type="password" inputmode="numeric" pattern="[0-9]">
            <input class="pin-digit" id="d4" maxlength="1" type="password" inputmode="numeric" pattern="[0-9]">
        </div>
        <button class="btn-login" onclick="checkPassword()">دخول</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- ── DASHBOARD ──────────────────────────────────── -->
<div id="dashboard">

    <!-- Header -->
    <header class="dash-header">
        <div class="dash-brand">
            <div class="brand-dots">
                <div class="brand-dot" style="background:var(--blue)"></div>
                <div class="brand-dot" style="background:var(--teal)"></div>
                <div class="brand-dot" style="background:var(--yellow)"></div>
                <div class="brand-dot" style="background:var(--red)"></div>
            </div>
            <div>
                <div class="brand-name">MDWN Analytics</div>
                <div class="brand-sub" id="last-updated">جاري التحميل…</div>
            </div>
        </div>
        <div class="live-badge"><div class="live-dot"></div>مباشر</div>
        <button class="btn-logout" onclick="logout()">خروج</button>
    </header>

    <!-- Pill Nav Bar -->
    <div class="nav-bar-wrap">
        <div class="nav-bar" id="nav-bar">
            <div class="nav-pill-indicator" id="pill-indicator"></div>
            <button class="nav-pill active" data-section="hujra">🚪 باب الحجرة</button>
            <button class="nav-pill" data-section="samrqand">⚖️ قضية سمرقند</button>
            <button class="nav-pill" data-section="ghailam">🐒 القرد والغيلم</button>
            <div class="nav-separator"></div>
            <button class="nav-pill" data-section="main">🏠 الصفحة الرئيسية</button>
            <button class="nav-pill" data-section="projects">📁 المشاريع</button>
        </div>
    </div>

    <!-- Body -->
    <div class="dash-body">

        <!-- ── HUJRA ── -->
        <div class="section-panel active" id="panel-hujra"></div>
        <!-- ── SAMRQAND ── -->
        <div class="section-panel" id="panel-samrqand"></div>
        <!-- ── GHAILAM ── -->
        <div class="section-panel" id="panel-ghailam"></div>
        <!-- ── MAIN ── -->
        <div class="section-panel" id="panel-main"></div>
        <!-- ── PROJECTS ── -->
        <div class="section-panel" id="panel-projects"></div>

        <div class="dash-footer" id="footer-time">آخر تحديث: —</div>
    </div>
</div>

<!-- Part 2: JS will be inlined here via script tag -->
<script src="analytics-dashboard.js"></script>
</body>
</html>
